# Docker Compose for IP-only access (no domain, no SSL)
# Usage: docker-compose -f docker-compose.ip.yml up -d --build
# Access: http://YOUR-VPS-IP:8000

services:
  # ─── Ollama ────────────────────────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: ollama-server
    volumes:
      - ollama-models:/root/.ollama
    # Uncomment for GPU support (requires nvidia-container-toolkit)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "ollama list > /dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # ─── OllamaOptimizerGUI ─────────────────────────────────────────────────────
  oog:
    build: .
    container_name: ollama-optimizer-gui
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - OOG_WORKERS=${OOG_WORKERS:-4}
      - OOG_LOG_LEVEL=${OOG_LOG_LEVEL:-info}
      - OOG_CORS_ORIGINS=${OOG_CORS_ORIGINS:-*}
      - OOG_API_KEY=${OOG_API_KEY:-}
      - OOG_RATE_LIMIT=${OOG_RATE_LIMIT:-0}
      - OOG_BASE_PATH=${OOG_BASE_PATH:-/oog}
    depends_on:
      - ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000${OOG_BASE_PATH:-/oog}/api/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  ollama-models:
