services:
  # ─── Ollama ────────────────────────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: ollama-server
    # Ollama is internal-only; accessed by oog via Docker network
    # Uncomment to expose Ollama API directly (not recommended for production)
    # ports:
    #   - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    # Uncomment for GPU support (requires nvidia-container-toolkit)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "ollama list > /dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # ─── OllamaOptimizerGUI ─────────────────────────────────────────────────────
  oog:
    build: .
    container_name: ollama-optimizer-gui
    # Internal only — Caddy handles external traffic
    # For IP-only access without domain, uncomment ports below and comment out caddy
    expose:
      - "8000"
    # ports:
    #   - "8000:8000"
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - OOG_WORKERS=${OOG_WORKERS:-4}
      - OOG_LOG_LEVEL=${OOG_LOG_LEVEL:-info}
      - OOG_CORS_ORIGINS=${OOG_CORS_ORIGINS:-*}
      - OOG_API_KEY=${OOG_API_KEY:-}
      - OOG_RATE_LIMIT=${OOG_RATE_LIMIT:-0}
      - OOG_BASE_PATH=${OOG_BASE_PATH:-/oog}
      - OOG_DB_PATH=/app/data/oog.db
      - OOG_JWT_SECRET=${OOG_JWT_SECRET:-oog-secret-change-in-production-please}
    volumes:
      - oog-data:/app/data
    depends_on:
      - ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000${OOG_BASE_PATH:-/oog}/api/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ─── Caddy reverse proxy (automatic HTTPS) ─────────────────────────────────
  # Handles SSL certificates automatically via Let's Encrypt.
  # Set OOG_DOMAIN in .env to your domain (e.g., oog.example.com)
  # For IP-only access without domain, comment out this entire service
  # and uncomment ports above in the oog service.
  caddy:
    image: caddy:2-alpine
    container_name: oog-caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    environment:
      - OOG_DOMAIN=${OOG_DOMAIN:-localhost}
      - OOG_API_KEY=${OOG_API_KEY:-}
    depends_on:
      - oog
    restart: unless-stopped

volumes:
  ollama-models:
  oog-data:
  caddy-data:
  caddy-config:
