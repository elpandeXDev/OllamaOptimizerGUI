# ─── OllamaOptimizerGUI — Development / No SSL ────────────────────────────────
# Use this for local development or servers behind an existing reverse proxy
# (nginx, Traefik, Cloudflare Tunnel, etc.) that already handles SSL.
#
# Usage:
#   docker compose -f docker-compose.dev.yml up -d --build
#
# Access at: http://localhost:8080

services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama-server-dev
    ports:
      - "11434:11434"
    volumes:
      - ollama-models-dev:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "ollama list > /dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  oog:
    build: .
    container_name: ollama-optimizer-gui-dev
    ports:
      - "8080:8000"
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - OOG_WORKERS=2
      - OOG_LOG_LEVEL=debug
      - OOG_CORS_ORIGINS=*
      - OOG_BASE_PATH=/oog
      - OOG_DB_PATH=/app/data/oog.db
    volumes:
      - oog-data-dev:/app/data
    depends_on:
      - ollama
    restart: unless-stopped

volumes:
  ollama-models-dev:
  oog-data-dev:
